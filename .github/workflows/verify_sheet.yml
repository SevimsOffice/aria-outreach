name: ARIA Sheet Doğrulama (salt-okunur)

# Hiçbir mail göndermez. Sadece Sheet'in gerçek durumunu (kaç kayıt bugün
# güncellendi, içerik kolonu dolu mu) loglara döker. Geçici doğrulama aracı.

on:
  push:
    branches: [claude/confident-ramanujan-cPwuq]
    paths:
      - '.github/workflows/verify_sheet.yml'
      - 'scripts/verify_sheet_state.py'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify sheet state
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID:             ${{ secrets.GOOGLE_SHEET_ID }}
          TELEGRAM_BOT_TOKEN:          ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:            ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/verify_sheet_state.py
